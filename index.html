<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake 1.2.1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="menu" id="mainMenu">
    <button id="playBtn">Play</button>
    <button id="customBtn">Customize</button>
    <button id="quitBtn">Exit game</button>
</div>

<div id="customOverlay">
    <div id="customContent">
        <div id="leftPanel">
            <h2>Snake Preview</h2>
            <canvas id="previewCanvas" width="200" height="200"></canvas>
        </div>

        <div id="rightPanel">
            <h2>Select Color</h2>
            <div id="colorPalette"></div>
            <br>
            <button id="closeCustom">Back</button>
        </div>
    </div>
</div>

<div id="overlay">
    <button id="resumeBtn">Resume game</button>
    <button id="menuBtn">Exit to menu</button>
</div>

<div id="scoreBoard">
    Your best: <span id="highScore">0</span><br>
    Your score: <span id="score">0</span>
</div>

<button id="soundBtn">Toggle Sound</button>

<canvas id="game"></canvas>
<audio id="bgMusic" src="music.mp3" loop></audio>

<script src="core.js"></script>
<script src="render.js"></script>
<script src="input.js"></script>
<script src="menu.js"></script>
<script src="customize.js"></script>

</body>
</html>
