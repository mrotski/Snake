<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake 125328022026</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="menu" id="mainMenu">
    <button id="playBtn">Play</button>
    <button id="customBtn">Customize Snake</button>
    <button id="quitBtn">Quit</button>
</div>

<div id="customOverlay">
    <div id="customContent">
        <div id="leftPanel">
            <h2>Snake Preview</h2>
            <canvas id="previewCanvas" width="200" height="200"></canvas>
        </div>

        <div id="vaultButton">?</div>

       <div id="vaultOverlay">
       <input id="vaultInput" placeholder="Enter code...">
       </div>

        <div id="rightPanel">
            <h2>Select Color</h2>
            <div id="colorPalette"></div>
            <br>
            <button id="closeCustom">Back</button>
        </div>
    </div>
</div>

<div id="overlay">
    <button id="resumeBtn">Resume</button>
    <button id="menuBtn">Main Menu</button>
</div>

<div id="scoreBoard">
    Highscore: <span id="highScore">0</span><br>
    Score: <span id="score">0</span>
</div>

<button id="fullscreenBtn">Toggle Fullscreen</button>
<button id="soundBtn">Toggle Sound</button>

<canvas id="game"></canvas>
<audio id="bgMusic" src="music.mp3" loop></audio>

<script src="core.js"></script>
<script src="render.js"></script>
<script src="input.js"></script>
<script src="menu.js"></script>
<script src="customize.js"></script>

</body>
</html>
