<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, viewport-fit=cover">
<title>Snake 1.11</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- MAIN MENU -->
<div class="menu" id="mainMenu">
    <button id="playBtn">Play</button>
    <button id="customBtn">Customize</button>
    <button id="settingsBtn">Settings</button>
    <button id="quitBtn">Exit game</button>
</div>

<div id="versionText">Snake 1.11 -- Copyright RGS2026</div>

<!-- SETTINGS MENU -->
<div id="settingsOverlay">
    <div id="settingsContent">
        <div id="settingsHeader">
            <h2>Settings</h2>
            <button id="closeSettings">Back</button>
        </div>

        <div id="settingsTabs">
            <button class="settingsTab" data-tab="songs">Songs</button>
            <button class="settingsTab" data-tab="fullscreen">Fullscreen</button>
            <button class="settingsTab" data-tab="fonts">Fonts (beta)</button>
            <button class="settingsTab" data-tab="resolution">Resolution (beta)</button>
        </div>

        <div class="settingsPanel" data-panel="songs">
            <div id="songsList"></div>
        </div>

        <div class="settingsPanel" data-panel="fullscreen" style="display:none">
            <div id="fullscreenSettings">
                <div class="fsOption" data-fs="fullscreen">
                    <div class="fsTitle">Prefer fullscreen when possible</div>
                    <div class="fsMeta">Tries to enter fullscreen on first click / Play.</div>
                </div>
                <div class="fsOption" data-fs="windowed">
                    <div class="fsTitle">Prefer windowed</div>
                    <div class="fsMeta">Never requests fullscreen.</div>
                </div>
            </div>
        </div>

        <div class="settingsPanel" data-panel="fonts" style="display:none">
            <div id="fontsList"></div>
        </div>

        <div class="settingsPanel" data-panel="resolution" style="display:none">
            <div id="resolutionList"></div>
        </div>
    </div>
</div>

<!-- CUSTOMIZE MENU -->
<div id="customOverlay">
    <div id="customContent">
        
        <div id="leftPanel">
            <h2>Coming soon!</h2>
            <canvas id="previewCanvas" width="200" height="200"></canvas>
        </div>

        <div id="rightPanel">
            <h2>Select Color</h2>
            <div id="colorPalette"></div>
            <br>
            <button id="closeCustom">Back</button>
        </div>

    </div>
</div>

<!-- PAUSE MENU -->
<div id="overlay">
    <button id="resumeBtn">Back to game</button>
    <button id="menuBtn">Exit to menu</button>
</div>

<!-- SCORE -->
<div id="scoreBoard">
    Your best: <span id="highScore">0</span><br>
    Your current: <span id="score">0</span>
</div>

<!-- SOUND -->
<button id="soundBtn">Toggle Sound</button>

<!-- GAME -->
<canvas id="game"></canvas>
<audio id="bgMusic" src="music.mp3" loop></audio>

<!-- 🔥 MOBILE CONTROLS (OIKEA PAIKKA) -->
<div id="mobileControls">
    <div class="dpad">
        <button class="ctrl up">▲</button>
        <div class="middleRow">
            <button class="ctrl left">◀</button>
            <button class="ctrl right">▶</button>
        </div>
        <button class="ctrl down">▼</button>
    </div>
</div>

<!-- SCRIPTS -->
<script src="core.js"></script>
<script src="render.js"></script>
<script src="input.js"></script>
<script src="songs/index.js"></script>
<script src="menu.js"></script>
<script src="customize.js"></script>

<div id="toast" role="status" aria-live="polite"></div>

</body>
</html>
